name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read-only token: these jobs only check out and test the code.
permissions:
  contents: read

jobs:
  # Full suite for everything except Dependabot PRs.
  pytest:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (ty)
        run: uv run ty check

      # Coverage lives here rather than in pyproject.toml's addopts: instrumenting
      # every module roughly quadruples the wall time, which is a bad trade on
      # a developer's machine and a fine one in CI.
      - name: Run tests
        run: >-
          uv run -m pytest tests/ -v --suite=all
          --cov --cov-report=term-missing:skip-covered
          --cov-fail-under=78
        env:
          SECRET_KEY: test-secret-key
          GOOGLE_CLIENT_ID: test-id
          GOOGLE_CLIENT_SECRET: test-secret
          # TEST_DATABASE_URL (not DATABASE_URL) is what main.py reads when
          # APP_ENV=development; conftest.py sets it too, this is belt-and-braces.
          TEST_DATABASE_URL: "sqlite:///:memory:"
          APP_ENV: development

  # Dependabot PRs get a fast SQLite smoke test instead of the full suite:
  # importing main runs create_app() (blueprints, models, dev seeding) on
  # SQLite, so a bump that breaks an install or an import fails right here. The
  # Claude review (dependabot-claude-review.yml) covers the judgement call.
  smoke:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      # The Docker build runs the uv from DOCKERFILE's `uv` image, which this job
      # never builds. Run that same uv version here: it refuses a version outside
      # pyproject.toml's `required-version`, and must accept the lockfile.
      - name: DOCKERFILE's uv accepts the project
        run: |
          version=$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9.]*\) AS uv$|\1|p' DOCKERFILE)
          test -n "$version" || { echo "No uv image tag found in DOCKERFILE"; exit 1; }
          uvx "uv@$version" lock --check

      - name: Smoke test (app boots on SQLite)
        run: uv run python -c "import main; print('App import + create_app() OK')"
        env:
          SECRET_KEY: test-secret-key
          GOOGLE_CLIENT_ID: test-id
          GOOGLE_CLIENT_SECRET: test-secret
          # No TEST_DATABASE_URL here on purpose — the smoke test should exercise
          # the real dev path (instance/site.db + full seeding) on a clean runner.
          APP_ENV: development
