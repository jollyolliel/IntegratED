name: PR previews

# One Cloud Run service per open PR (`pr-<number>`) with its own URL, plus a
# `main` baseline, in a separate Google Cloud project, on fake data, behind
# Identity-Aware Proxy. docs/operations/previews.md; ADR 0013.
#
# A `pull_request` run uses the PR's own copy of this file, so nothing here is a
# security boundary: the limits are the preview deployer's IAM roles, which reach
# only the preview project. Never `pull_request_target`.
#
# Every job is skipped until the PREVIEW_PROJECT_ID repository variable exists
# (scripts/setup_previews.sh sets it last).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: preview-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: true

permissions: {}

env:
  PROJECT_ID: ${{ vars.PREVIEW_PROJECT_ID }}
  REGION: ${{ vars.PREVIEW_REGION }}
  SERVICE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  # The branch's own tip, not GitHub's merge commit: what the reviewer would check out.
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  REGISTRY: ${{ vars.PREVIEW_REGION }}-docker.pkg.dev/${{ vars.PREVIEW_PROJECT_ID }}/${{ vars.PREVIEW_ARTIFACT_REPO }}

jobs:
  # Runs the PR's code (COPY . . and every RUN), so it holds no credential at all.
  build:
    if: >-
      vars.PREVIEW_PROJECT_ID != '' && (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Build the preview image
        run: |
          docker build -f DOCKERFILE --target preview --build-context previewdata=seed/files \
            --build-arg GIT_SHA="$SHA" -t "preview:$SHA" .
          docker save "preview:$SHA" | gzip > image.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  deploy:
    needs: build
    if: >-
      vars.PREVIEW_PROJECT_ID != '' && (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-image

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker load < image.tar.gz
          docker tag "preview:$SHA" "$REGISTRY/$SERVICE:$SHA"
          docker push "$REGISTRY/$SERVICE:$SHA"

      # The runtime account has no IAM roles, and no secret is mounted: there is
      # nothing in this project for the PR's code to read.
      - name: Deploy the preview
        id: deploy
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          RUNTIME_ACCOUNT: ${{ vars.PREVIEW_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          links=$(python3 -m helpers.preview.links encode)
          url=$(gcloud run deploy "$SERVICE" \
            --image "$REGISTRY/$SERVICE:$SHA" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --service-account="$RUNTIME_ACCOUNT" \
            --no-allow-unauthenticated \
            --iap \
            --max-instances=1 \
            --min-instances=0 \
            --cpu=1 \
            --memory=1Gi \
            --cpu-boost \
            --port=8080 \
            --set-env-vars="APP_ENV=preview,PREVIEW_PR=$PR_NUMBER,PREVIEW_LINKS=$links" \
            --quiet \
            --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url/_preview/" >> "$GITHUB_STEP_SUMMARY"

      - name: Update the PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          python3 -m helpers.preview.links comment "$URL" "$SHA" > comment.md
          # One comment per PR, edited on every push.
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- integrated-preview -->"))) | .id' \
            | sed -n 1p)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi

  teardown:
    if: >-
      vars.PREVIEW_PROJECT_ID != '' && github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # A PR closed before its first deploy has neither, which is not a failure.
      - name: Delete the preview
        run: |
          set -euo pipefail
          if gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" > /dev/null 2>&1; then
            gcloud run services delete "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --quiet
          fi
          if gcloud artifacts docker images list "$REGISTRY/$SERVICE" --format='value(package)' 2> /dev/null | grep -q .; then
            gcloud artifacts docker images delete "$REGISTRY/$SERVICE" --delete-tags --quiet
          fi

  # Catches whatever a failed or cancelled teardown left running.
  sweep:
    if: vars.PREVIEW_PROJECT_ID != '' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Delete previews of closed PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          services=$(gcloud run services list --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)')
          for service in $services; do
            [[ "$service" =~ ^pr-([0-9]+)$ ]] || continue
            # A failed lookup stops the sweep rather than deleting a live preview.
            state=$(gh pr view "${BASH_REMATCH[1]}" --repo "$REPO" --json state --jq .state)
            if [ "$state" != "OPEN" ]; then
              echo "Deleting $service (PR is $state)"
              gcloud run services delete "$service" --project "$PROJECT_ID" --region "$REGION" --quiet
              if gcloud artifacts docker images list "$REGISTRY/$service" --format='value(package)' 2> /dev/null | grep -q .; then
                gcloud artifacts docker images delete "$REGISTRY/$service" --delete-tags --quiet
              fi
            fi
          done
