version: 2

# Version updates run weekly; security updates run as soon as an advisory lands. Both read this
# file: the labels and commit prefix below apply to either kind, and each ecosystem has one group
# per kind so a week's bumps (or one advisory's fixes) arrive as a single PR.
# `release:patch` + `deploy:skip`: a dependency bump cuts a patch tag but does not redeploy on
# its own (see .github/workflows/auto-tag.yml and deploy.yml).
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Athens"
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "release:patch"
      - "deploy:skip"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Athens"
    groups:
      all-actions:
        applies-to: version-updates
        patterns:
          - "*"
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "release:patch"
      - "deploy:skip"
    commit-message:
      prefix: "chore(deps)"

  # The base images in DOCKERFILE.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Athens"
    groups:
      base-image:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "release:patch"
      - "deploy:skip"
    commit-message:
      prefix: "chore(deps)"
