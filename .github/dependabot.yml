version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "release:patch"
      - "deploy:skip"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "release:patch"
      - "deploy:skip"
    commit-message:
      prefix: "chore(deps)"
