name: "IntegratED CodeQL configuration"

# Read by .github/workflows/codeql.yml (advanced setup). Goal: catch as much as CodeQL can,
# on top of the default suite that GitHub's default setup runs.

# `security-and-quality` is a superset of `security-extended`, which is a superset of the
# default suite: every default query, the lower-precision security queries, and the
# maintainability/correctness queries.
queries:
  - uses: security-and-quality

# The default threat model only treats remote input (HTTP requests) as tainted. `local` adds
# command-line arguments, environment variables, files and stdin — the inputs of commands.py and
# of the content folder the app syncs from, which the remote model never looks at.
threat-models: local

# Queries dropped because every alert they raised here was a false positive, with what still covers
# the risk:
query-filters:
  # Read the `if TYPE_CHECKING:` imports that type hints need as real import cycles. A real cycle
  # fails the import of `main` that every test run starts with.
  - exclude:
      id: py/cyclic-import
  - exclude:
      id: py/unsafe-cyclic-import
  # Reports a module-level latch written under `global` and read on the next call as unused.
  - exclude:
      id: py/unused-global-variable
  # Security Lab audit queries: every `except …: continue` and every MD5 call, whatever it is for.
  # py/empty-except still flags a bare `pass`, and py/weak-sensitive-data-hashing (in the suite
  # above) still flags MD5/SHA-1 on passwords and other sensitive data.
  - exclude:
      id: githubsecuritylab/insufficient-logging
  - exclude:
      id: githubsecuritylab/weak-cryptographic-algorithm

packs:
  python:
    # GitHub Security Lab community queries (extra sinks, frameworks and audit checks).
    - githubsecuritylab/codeql-python-queries
    # Credential checks the standard suites leave out.
    - codeql/python-queries:Security/CWE-798/HardcodedCredentials.ql
  javascript:
    - githubsecuritylab/codeql-javascript-queries
    - codeql/javascript-queries:Security/CWE-798/HardcodedCredentials.ql
    - codeql/javascript-queries:Security/CWE-313/PasswordInConfigurationFile.ql
  actions:
    - githubsecuritylab/codeql-actions-queries

paths-ignore:
  # Third-party and generated code: findings there are not ours to fix.
  - .venv
  - node_modules
  - static/css/tailwind.css
  - "**/__pycache__"
  # Code that never ships in the image or runs on the server: developer scripts, agent tooling and
  # skills, and the test suite (deliberate fixture passwords and paths, probes that look like bugs).
  # ruff and ty still lint all three in CI.
  - scripts
  - .claude
  - tests
