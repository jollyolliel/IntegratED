<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" aria-hidden="true">
  <!-- Potion Workshop backdrop: a candlelit stone-and-timber cottage at dusk.
       Back-to-front: plaster wall, stone patches, panelling, window view (sky, far/mid/near
       hills), shelves of jars, herbs, beam, floor. The mantel shelf, cauldron and the dark
       foreground framing (cottage-front.svg) are separate layers drawn by the page.
       Keep x 128-672, y 100-230 calm: the page's potion shelf sits there. -->
  <defs>
    <radialGradient id="cw-glow" cx="400" cy="470" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9B587"/>
      <stop offset="0.45" stop-color="#C48E68"/>
      <stop offset="1" stop-color="#8A5E46"/>
    </radialGradient>
    <linearGradient id="cw-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2F25" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#4A2F25" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34396F"/>
      <stop offset="0.5" stop-color="#7F65A0"/>
      <stop offset="0.85" stop-color="#F0A884"/>
      <stop offset="1" stop-color="#F7C79A"/>
    </linearGradient>
    <linearGradient id="cw-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A4331"/>
      <stop offset="1" stop-color="#3E271D"/>
    </linearGradient>
    <linearGradient id="cw-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83563D"/>
      <stop offset="1" stop-color="#6B4430"/>
    </linearGradient>
    <radialGradient id="cw-candle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE3A3" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFB45E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cw-window-clip">
      <path d="M62 418 V306 A63 63 0 0 1 188 306 V418 Z"/>
    </clipPath>
    <g id="cw-flame">
      <path d="M0 -15 C5 -8 6 -3 6 1 A6 6 0 0 1 -6 1 C-6 -4 -3 -8 0 -15 Z" fill="#FFC453"/>
      <path d="M0 -8 C2.5 -4 3 -1 3 1.5 A3 3 0 0 1 -3 1.5 C-3 -1 -1.5 -4 0 -8 Z" fill="#FFF1C2"/>
    </g>
    <style>
      .flick { transform-box: fill-box; transform-origin: 50% 90%; animation: cw-flick 2.6s ease-in-out infinite; }
      .flick.b { animation-duration: 3.3s; animation-delay: -1.2s; }
      .halo { transform-box: fill-box; transform-origin: center; animation: cw-halo 3.1s ease-in-out infinite; }
      .halo.b { animation-delay: -1.6s; }
      .twinkle { animation: cw-tw 3.4s ease-in-out infinite; }
      .twinkle.b { animation-delay: -1.1s; } .twinkle.c { animation-delay: -2.3s; }
      .sway { transform-box: fill-box; transform-origin: 50% 0; animation: cw-sway 7s ease-in-out infinite; }
      .sway.b { animation-delay: -3s; animation-duration: 8.5s; }
      @keyframes cw-flick { 0%,100% { transform: scale(1, 1) } 30% { transform: scale(0.92, 1.08) } 60% { transform: scale(1.05, 0.95) } }
      @keyframes cw-halo { 0%,100% { opacity: 0.85; transform: scale(1) } 50% { opacity: 1; transform: scale(1.08) } }
      @keyframes cw-tw { 0%,100% { opacity: 0.9 } 50% { opacity: 0.25 } }
      @keyframes cw-sway { 0%,100% { transform: rotate(-1.6deg) } 50% { transform: rotate(1.6deg) } }
      @media (prefers-reduced-motion: reduce) { .flick, .halo, .twinkle, .sway { animation: none } }
    </style>
  </defs>

  <!-- Plaster wall, warm from the fire below -->
  <rect width="800" height="600" fill="url(#cw-glow)"/>
  <rect width="800" height="600" fill="url(#cw-top)"/>

  <!-- Exposed stone where the plaster has worn away: a darker mortar patch with stones in it -->
  <g>
    <path d="M596 236 Q620 226 646 234 Q664 246 656 262 Q640 274 612 270 Q590 262 596 236 Z" fill="#A27459"/>
    <g fill="#C49A79"><rect x="600" y="238" width="26" height="14" rx="6"/><rect x="630" y="238" width="22" height="14" rx="6"/><rect x="610" y="255" width="34" height="12" rx="6"/></g>
  </g>

  <!-- Window: dusk outside, three hill planes (far = palest and bluest) -->
  <g clip-path="url(#cw-window-clip)">
    <rect x="56" y="236" width="140" height="190" fill="url(#cw-sky)"/>
    <circle cx="96" cy="282" r="13" fill="#FFF3D6"/>
    <circle cx="102" cy="278" r="12" fill="#5D4F8C"/>
    <g fill="#FFF3D6">
      <circle class="twinkle" cx="150" cy="268" r="1.8"/>
      <circle class="twinkle b" cx="128" cy="300" r="1.3"/>
      <circle class="twinkle c" cx="170" cy="306" r="1.5"/>
      <circle class="twinkle b" cx="80" cy="318" r="1.2"/>
    </g>
    <path d="M56 372 Q90 346 122 360 Q150 338 196 356 V426 H56 Z" fill="#B49AC4"/>
    <path d="M56 392 Q84 372 116 386 Q152 368 196 384 V426 H56 Z" fill="#8670AA"/>
    <path d="M56 408 Q100 396 130 404 Q166 394 196 404 V426 H56 Z" fill="#5E4C88"/>
    <g fill="#4A3B73">
      <path d="M74 404 l7 -22 l7 22 Z"/><path d="M86 406 l5 -15 l5 15 Z"/>
      <path d="M158 400 l8 -26 l8 26 Z"/><path d="M172 402 l5 -14 l5 14 Z"/>
    </g>
    <path d="M70 420 L150 250 L176 250 L96 420 Z" fill="#FFFFFF" opacity="0.08"/>
  </g>
  <!-- Window frame + mullions -->
  <path d="M54 420 V306 A71 71 0 0 1 196 306 V420 H188 V306 A63 63 0 0 0 62 306 V420 Z" fill="#4E3223"/>
  <rect x="121" y="243" width="8" height="177" fill="#4E3223"/>
  <rect x="62" y="334" width="126" height="7" fill="#4E3223"/>
  <path d="M58 306 A67 67 0 0 1 125 239" fill="none" stroke="#6E4A34" stroke-width="3"/>
  <!-- Sill with a pot of herbs and a candle -->
  <rect x="40" y="418" width="172" height="13" rx="3" fill="#5E3C2A"/>
  <rect x="40" y="418" width="172" height="4" rx="2" fill="#7C5440"/>
  <path d="M150 418 l3 -20 h22 l3 20 Z" fill="#A65A3C"/>
  <rect x="149" y="396" width="30" height="6" rx="2" fill="#B9694A"/>
  <g fill="#5F7F4A">
    <path d="M164 397 C150 380 146 368 150 360 C160 370 164 382 164 397 Z"/>
    <path d="M164 397 C176 378 184 370 190 368 C186 380 176 390 164 397 Z"/>
    <path d="M164 397 C162 380 164 366 170 356 C172 370 170 386 164 397 Z" fill="#78985C"/>
  </g>
  <circle class="halo" cx="80" cy="390" r="30" fill="url(#cw-candle)"/>
  <rect x="74" y="396" width="12" height="22" rx="2" fill="#F3E3C6"/>
  <rect x="74" y="396" width="4" height="22" rx="2" fill="#FFF6E6"/>
  <g transform="translate(80 392)"><use href="#cw-flame" class="flick"/></g>

  <!-- Wainscot panelling under the plaster -->
  <rect x="0" y="446" width="800" height="90" fill="url(#cw-panel)"/>
  <rect x="0" y="446" width="800" height="9" fill="#9A6A4C"/>
  <rect x="0" y="455" width="800" height="3" fill="#5C3A28" opacity="0.6"/>
  <g fill="#6A422E" opacity="0.75">
    <rect x="18" y="468" width="96" height="56" rx="4"/>
    <rect x="132" y="468" width="96" height="56" rx="4"/>
    <rect x="572" y="468" width="96" height="56" rx="4"/>
    <rect x="686" y="468" width="96" height="56" rx="4"/>
  </g>
  <g fill="#93644A" opacity="0.5">
    <rect x="18" y="468" width="96" height="3" rx="1.5"/>
    <rect x="132" y="468" width="96" height="3" rx="1.5"/>
    <rect x="572" y="468" width="96" height="3" rx="1.5"/>
    <rect x="686" y="468" width="96" height="3" rx="1.5"/>
  </g>

  <!-- Stone hearth alcove behind the cauldron: lighter stone so the dark iron pot reads against it -->
  <defs>
    <linearGradient id="cw-recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3428"/>
      <stop offset="0.6" stop-color="#8A4A30"/>
      <stop offset="1" stop-color="#D98450"/>
    </linearGradient>
  </defs>
  <path d="M232 536 V372 A168 120 0 0 1 568 372 V536 Z" fill="#B68D6C"/>
  <path d="M268 536 V380 A132 96 0 0 1 532 380 V536 Z" fill="url(#cw-recess)"/>
  <path d="M232 372 A168 120 0 0 1 568 372" fill="none" stroke="#D2AD8B" stroke-width="4"/>
  <g stroke="#8E6650" stroke-width="3">
    <line x1="246" y1="330" x2="276" y2="344"/><line x1="282" y1="296" x2="304" y2="318"/>
    <line x1="334" y1="270" x2="346" y2="296"/><line x1="400" y1="252" x2="400" y2="284"/>
    <line x1="466" y1="270" x2="454" y2="296"/><line x1="518" y1="296" x2="496" y2="318"/>
    <line x1="554" y1="330" x2="524" y2="344"/>
    <line x1="232" y1="410" x2="268" y2="410"/><line x1="232" y1="460" x2="268" y2="460"/><line x1="232" y1="506" x2="268" y2="506"/>
    <line x1="532" y1="410" x2="568" y2="410"/><line x1="532" y1="460" x2="568" y2="460"/><line x1="532" y1="506" x2="568" y2="506"/>
  </g>
  <path d="M268 380 A132 96 0 0 1 400 284 V300 A118 84 0 0 0 282 384 Z" fill="#2E1A14" opacity="0.35"/>

  <!-- Right wall: two little shelves of jars, books and a candle -->
  <g>
    <rect x="600" y="306" width="168" height="10" rx="3" fill="#5E3C2A"/>
    <rect x="600" y="306" width="168" height="3" rx="1.5" fill="#7C5440"/>
    <path d="M612 316 l14 0 l-14 16 Z" fill="#4E3223"/>
    <path d="M756 316 l-14 0 l14 16 Z" fill="#4E3223"/>
    <!-- jars on the upper shelf: varied silhouettes, muted so they stay in the back plane -->
    <path d="M612 306 v-26 q0 -8 8 -8 h14 q8 0 8 8 v26 Z" fill="#6E8B86"/>
    <rect x="614" y="266" width="26" height="7" rx="2" fill="#8B6247"/>
    <rect x="616" y="282" width="5" height="18" rx="2.5" fill="#A7C1BC" opacity="0.6"/>
    <path d="M652 306 q-14 0 -14 -16 q0 -14 14 -18 v-8 h8 v8 q14 4 14 18 q0 16 -14 16 Z" fill="#8A5F7C"/>
    <rect x="651" y="258" width="10" height="7" rx="2" fill="#C69A6B"/>
    <circle cx="648" cy="288" r="4" fill="#B88BA8" opacity="0.6"/>
    <rect x="684" y="276" width="9" height="30" rx="2" fill="#7A3E3A"/>
    <rect x="694" y="270" width="11" height="36" rx="2" fill="#3F5C66"/>
    <rect x="706" y="280" width="8" height="26" rx="2" fill="#8C7A3E"/>
    <circle class="halo b" cx="740" cy="282" r="30" fill="url(#cw-candle)"/>
    <rect x="734" y="284" width="12" height="22" rx="2" fill="#F3E3C6"/>
    <rect x="734" y="284" width="4" height="22" rx="2" fill="#FFF6E6"/>
    <g transform="translate(740 280)"><use href="#cw-flame" class="flick b"/></g>

    <rect x="616" y="388" width="152" height="10" rx="3" fill="#5E3C2A"/>
    <rect x="616" y="388" width="152" height="3" rx="1.5" fill="#7C5440"/>
    <path d="M628 398 l14 0 l-14 16 Z" fill="#4E3223"/>
    <path d="M756 398 l-14 0 l14 16 Z" fill="#4E3223"/>
    <!-- lower shelf: a squat jar, a tall flask and a bowl -->
    <path d="M630 388 q-6 0 -6 -6 v-14 q0 -6 6 -6 h22 q6 0 6 6 v14 q0 6 -6 6 Z" fill="#A47A4E"/>
    <rect x="632" y="356" width="18" height="6" rx="2" fill="#6E4A34"/>
    <path d="M684 388 q-16 0 -16 -15 q0 -11 11 -15 v-22 h10 v22 q11 4 11 15 q0 15 -16 15 Z" fill="#5E7F6A"/>
    <rect x="678" y="330" width="12" height="7" rx="2" fill="#8B6247"/>
    <path d="M712 372 h44 q0 16 -22 16 q-22 0 -22 -16 Z" fill="#9C5E46"/>
    <path d="M712 372 h44" stroke="#B9785C" stroke-width="3"/>
  </g>

  <!-- Floor planks with warm firelight in the middle -->
  <rect x="0" y="532" width="800" height="68" fill="url(#cw-floor)"/>
  <rect x="0" y="532" width="800" height="5" fill="#2F1E16"/>
  <g stroke="#3A2419" stroke-width="2" opacity="0.7">
    <line x1="0" y1="556" x2="800" y2="556"/>
    <line x1="0" y1="582" x2="800" y2="582"/>
    <line x1="140" y1="537" x2="140" y2="556"/><line x1="420" y1="537" x2="420" y2="556"/><line x1="690" y1="537" x2="690" y2="556"/>
    <line x1="60" y1="556" x2="60" y2="582"/><line x1="300" y1="556" x2="300" y2="582"/><line x1="580" y1="556" x2="580" y2="582"/>
    <line x1="200" y1="582" x2="200" y2="600"/><line x1="500" y1="582" x2="500" y2="600"/>
  </g>
  <ellipse cx="400" cy="566" rx="230" ry="34" fill="#F2A35F" opacity="0.18"/>
  <!-- Round woven rug the cauldron's stone hearth sits on -->
  <ellipse cx="400" cy="574" rx="196" ry="24" fill="#7E3B33"/>
  <ellipse cx="400" cy="574" rx="176" ry="19" fill="none" stroke="#B5653F" stroke-width="4"/>
  <ellipse cx="400" cy="574" rx="150" ry="14" fill="none" stroke="#5E2A26" stroke-width="3"/>

  <!-- Ceiling: a swag of dried flowers along the beam, then the beam itself -->
  <path d="M150 40 Q400 92 650 40" fill="none" stroke="#6B5640" stroke-width="2"/>
  <g>
    <circle cx="200" cy="54" r="5" fill="#B88BA8"/><circle cx="214" cy="57" r="4" fill="#E2B35E"/>
    <circle cx="246" cy="63" r="5" fill="#C9775A"/><circle cx="262" cy="66" r="4" fill="#B88BA8"/>
    <circle cx="300" cy="71" r="5" fill="#E2B35E"/><circle cx="316" cy="72" r="4" fill="#C9775A"/>
    <circle cx="352" cy="76" r="5" fill="#B88BA8"/><circle cx="384" cy="78" r="5" fill="#E2B35E"/>
    <circle cx="416" cy="78" r="5" fill="#C9775A"/><circle cx="448" cy="76" r="5" fill="#B88BA8"/>
    <circle cx="484" cy="72" r="4" fill="#E2B35E"/><circle cx="500" cy="71" r="5" fill="#C9775A"/>
    <circle cx="538" cy="66" r="4" fill="#B88BA8"/><circle cx="554" cy="63" r="5" fill="#E2B35E"/>
    <circle cx="586" cy="57" r="4" fill="#C9775A"/><circle cx="600" cy="54" r="5" fill="#B88BA8"/>
  </g>
  <g fill="#6F8A57">
    <path d="M188 50 q8 -6 14 2 q-8 4 -14 -2 Z"/><path d="M232 60 q8 -6 14 2 q-8 4 -14 -2 Z"/>
    <path d="M284 69 q8 -6 14 2 q-8 4 -14 -2 Z"/><path d="M334 75 q8 -6 14 2 q-8 4 -14 -2 Z"/>
    <path d="M396 80 q8 -6 14 2 q-8 4 -14 -2 Z"/><path d="M462 75 q8 -6 14 2 q-8 4 -14 -2 Z"/>
    <path d="M516 69 q8 -6 14 2 q-8 4 -14 -2 Z"/><path d="M570 60 q8 -6 14 2 q-8 4 -14 -2 Z"/>
  </g>
  <!-- Hanging herb bundles (sway gently) -->
  <g class="sway">
    <line x1="96" y1="40" x2="96" y2="58" stroke="#6B5640" stroke-width="2"/>
    <rect x="90" y="56" width="12" height="6" rx="2" fill="#A9773F"/>
    <path d="M96 60 C80 74 78 92 84 104 C90 92 92 80 96 60 Z" fill="#7B9460"/>
    <path d="M96 60 C112 74 114 92 108 104 C102 92 100 80 96 60 Z" fill="#647D4E"/>
    <path d="M96 60 C92 78 94 94 96 108 C98 94 100 78 96 60 Z" fill="#8FA874"/>
  </g>
  <g class="sway b">
    <line x1="708" y1="40" x2="708" y2="56" stroke="#6B5640" stroke-width="2"/>
    <rect x="702" y="54" width="12" height="6" rx="2" fill="#A9773F"/>
    <path d="M708 58 C694 70 692 86 698 100 C702 88 704 76 708 58 Z" fill="#8C6BA0"/>
    <path d="M708 58 C722 70 724 86 718 100 C714 88 712 76 708 58 Z" fill="#76588A"/>
    <path d="M708 58 C705 76 706 92 708 104 C710 92 711 76 708 58 Z" fill="#A486B6"/>
  </g>
  <g class="sway">
    <line x1="746" y1="40" x2="746" y2="64" stroke="#6B5640" stroke-width="2"/>
    <rect x="740" y="62" width="12" height="6" rx="2" fill="#A9773F"/>
    <path d="M746 66 C732 78 732 94 738 106 C742 94 744 82 746 66 Z" fill="#9C8A4E"/>
    <path d="M746 66 C760 78 760 94 754 106 C750 94 748 82 746 66 Z" fill="#857440"/>
  </g>
  <rect x="0" y="0" width="800" height="42" fill="#3E281E"/>
  <rect x="0" y="36" width="800" height="6" fill="#56392A"/>
  <g stroke="#2E1D15" stroke-width="2" opacity="0.6">
    <line x1="40" y1="14" x2="180" y2="14"/><line x1="260" y1="22" x2="420" y2="22"/><line x1="520" y1="12" x2="700" y2="12"/>
  </g>
  <!-- Corner posts and knee braces -->
  <rect x="0" y="0" width="24" height="536" fill="#3E281E"/>
  <rect x="776" y="0" width="24" height="536" fill="#3E281E"/>
  <rect x="20" y="0" width="4" height="536" fill="#56392A"/>
  <rect x="776" y="0" width="4" height="536" fill="#2E1D15"/>
  <path d="M24 42 h46 l-46 46 Z" fill="#4A3024"/>
  <path d="M776 42 h-46 l46 46 Z" fill="#4A3024"/>
</svg>
