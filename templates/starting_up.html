<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2">
    <title>IntegratED — Starting up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F5F7FF;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .card {
            background: #fff;
            border: 2.5px solid #0284C7;
            border-radius: 20px;
            box-shadow: 5px 5px 0 #075985;
            padding: 48px 56px;
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .logo {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            color: #0284C7;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #BAE6FD;
            border-top-color: #0284C7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message {
            color: #1E1B4B;
            font-size: 1rem;
            font-weight: 600;
        }
        .sub {
            color: #6B7280;
            font-size: 0.85rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">IntegratED</div>
        <div class="spinner"></div>
        <p class="message">Getting things ready&hellip;</p>
        <p class="sub">This only takes a moment.</p>
    </div>
</body>
</html>
