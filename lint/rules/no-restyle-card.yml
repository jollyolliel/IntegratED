id: no-restyle-card
language: html
severity: error
message: |
  A clay card owns its radius, border, shadow and background — these utilities are not allowed on clay-card* / quick-action-card*.
note: |
  Pick the colour variant that matches what the card means (-green, -amber, -rose, -purple).
  Padding and layout utilities are fine. A new card colour is a new variant in
  static/css/components/cards.css.
rule:
  matches: class-value
  # [the clay element's class, the banned utilities] — scripts/lint_jx.py reads the second for
  # component tags, so keep exactly these two, in this order.
  all:
    - regex: '(?:^|[\s}])(?:clay-card|quick-action-card)'
    - regex: '(?:^|[\s}])(?:[\w-]+:)*!?-?(?:rounded(?:-\S+)?|shadow(?:-\S+)?|border(?:-\S+)?|bg-\S+|\[--(?:qa|card)-[\w-]+:[^\]]*\])(?:$|[\s{])'
