<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="IntegratED — learning through social interaction">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="440" rx="32"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <!-- soft background blobs in the brand tones -->
    <circle cx="1130" cy="40" r="170" fill="#bae6fd" opacity=".55"/>
    <circle cx="1010" cy="450" r="150" fill="#bbf7d0" opacity=".6"/>
    <circle cx="40" cy="430" r="120" fill="#fef3c7" opacity=".7"/>
  </g>
  <rect x="3" y="3" width="1194" height="434" rx="30" fill="none" stroke="#bae6fd" stroke-width="6"/>

  <!-- Logo mark: Classroom Sky rounded square, dark-sky hard shadow, white star (same as the app header) -->
  <g transform="translate(84 92)">
    <rect x="9" y="9" width="116" height="116" rx="34" fill="#075985"/>
    <rect x="3" y="3" width="116" height="116" rx="34" fill="#0284c7" stroke="#075985" stroke-width="6"/>
    <path transform="translate(11 11) scale(4.8)" fill="#fff"
      d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="'Baloo 2','Nunito','Trebuchet MS','Segoe UI',Arial,sans-serif">
    <text x="244" y="196" font-size="124" font-weight="800" fill="#0369a1" letter-spacing="-2">IntegratED</text>
    <text x="248" y="262" font-size="40" font-weight="700" fill="#1e1b4b">Learning through social interaction</text>
    <text x="250" y="304" font-size="22" font-weight="600" fill="#6b7280" letter-spacing="1">A youth-to-youth platform  ·  ACS Athens × The Home Project</text>
  </g>

  <!-- Clay pills: the three people in a pair's world, in tone colours -->
  <g font-family="'Baloo 2','Nunito','Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle">
    <g transform="translate(84 348)">
      <rect x="0" y="4" width="190" height="52" rx="26" fill="#bae6fd"/>
      <rect x="0" y="0" width="190" height="52" rx="26" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="3"/>
      <text x="95" y="35" fill="#075985">Learners</text>
    </g>
    <g transform="translate(294 348)">
      <rect x="0" y="4" width="190" height="52" rx="26" fill="#bbf7d0"/>
      <rect x="0" y="0" width="190" height="52" rx="26" fill="#dcfce7" stroke="#86efac" stroke-width="3"/>
      <text x="95" y="35" fill="#15803d">Volunteers</text>
    </g>
    <g transform="translate(504 348)">
      <rect x="0" y="4" width="190" height="52" rx="26" fill="#fde68a"/>
      <rect x="0" y="0" width="190" height="52" rx="26" fill="#fef3c7" stroke="#fcd34d" stroke-width="3"/>
      <text x="95" y="35" fill="#b45309">Teachers</text>
    </g>
  </g>

  <!-- Two speech bubbles = social interaction -->
  <g transform="translate(962 70) scale(.82)">
    <path d="M0 0h190a34 34 0 0 1 34 34v62a34 34 0 0 1-34 34H78l-34 34v-34H34A34 34 0 0 1 0 96V34A34 34 0 0 1 0 0z" transform="translate(6 7)" fill="#075985"/>
    <path d="M34 0h156a34 34 0 0 1 34 34v62a34 34 0 0 1-34 34H78l-34 34v-34H34A34 34 0 0 1 0 96V34A34 34 0 0 1 34 0z" fill="#0284c7" stroke="#075985" stroke-width="5"/>
    <g fill="#fff"><circle cx="76" cy="65" r="11"/><circle cx="112" cy="65" r="11"/><circle cx="148" cy="65" r="11"/></g>
  </g>
  <g transform="translate(992 222) scale(.82)">
    <path d="M30 0h150a30 30 0 0 1 30 30v50a30 30 0 0 1-30 30H168v30l-34-30H30A30 30 0 0 1 0 80V30A30 30 0 0 1 30 0z" transform="translate(6 7)" fill="#15803d"/>
    <path d="M30 0h150a30 30 0 0 1 30 30v50a30 30 0 0 1-30 30h-12v30l-34-30H30A30 30 0 0 1 0 80V30A30 30 0 0 1 30 0z" fill="#16a34a" stroke="#15803d" stroke-width="5"/>
    <path transform="translate(70 22) scale(3.5)" fill="#fff"
      d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
  </g>
</svg>
